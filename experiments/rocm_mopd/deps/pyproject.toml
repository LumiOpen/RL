[project]
name = "rocm-mopd-dependencies"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nvidia-modelopt", "devtools", "openai==2.44.0", "anthropic<=0.109.2",
  "mcp>=1.28.1,<2", "itsdangerous", "httptools", "uvloop", "yappi>=1.7.6",
  "aiohttp>=3.14.1", "mlflow-skinny>=3.16.0", "pydot", "TransferQueue",
  "quart", "hypercorn",
]

[tool.uv.sources]
nvidia-modelopt = { git = "https://github.com/NVIDIA/Model-Optimizer", rev = "43fd41a" }
TransferQueue = { git = "https://github.com/Ascend/TransferQueue", rev = "c516143" }

[tool.uv]
package = false
# Torch, NumPy, and Ray are supplied by the tested ROCm container and overlays.
override-dependencies = [
  "torch; sys_platform == 'never'", "numpy; sys_platform == 'never'",
  "ray; sys_platform == 'never'",
]
